name: Deploy static Vanilla Unicorn site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy uploaded artifact through the Pages API
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            // Use the REST artifact list: the artifact-results service can lag
            // behind an upload even when the REST metadata is already available.
            let artifact;
            for (let attempt = 0; attempt < 12; attempt++) {
              const result = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId
              });
              artifact = result.data.artifacts.find(a => a.name === 'github-pages' && !a.expired);
              if (artifact) break;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (!artifact) throw new Error('Uploaded Pages artifact is not visible.');
            const token = await core.getIDToken();
            const response = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner: context.repo.owner, repo: context.repo.repo,
              artifact_id: artifact.id, pages_build_version: context.sha, oidc_token: token
            });
            core.setOutput('page_url', response.data.page_url);
            const deploymentId = response.data.id || context.sha;
            for (let attempt = 0; attempt < 60; attempt++) {
              const result = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                owner: context.repo.owner, repo: context.repo.repo, deployment_id: deploymentId
              });
              if (result.data.status === 'succeed') {
                core.info('Pages deployment succeeded.');
                return;
              }
              if (!['queued', 'pending', 'in_progress', 'deploying', 'deployment_in_progress', 'waiting', 'updating_pages'].includes(result.data.status)) {
                throw new Error('Pages deployment failed: ' + result.data.status);
              }
              core.info('Pages deployment: ' + result.data.status);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Pages deployment did not complete within five minutes.');

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vanilla Unicorn | Drinks & Snacks</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');
:root{--pink:#ff3daf;--rose:#ff9cda;--gold:#f3d29b;--ink:#100812;--white:#fff4fb}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#09060a;color:var(--white);font-family:'DM Sans',Arial,sans-serif}body{background:radial-gradient(ellipse at 50% 0%,#5d1744 0%,#190b20 35%,#09060b 76%)}.screen{position:relative;isolation:isolate;width:100%;max-width:1920px;min-height:100vh;margin:auto;overflow:hidden;padding:2.1% 3% 2.5%;border:2px solid #b02b80;background:radial-gradient(ellipse at 50% 5%,#61204a44,transparent 50%)}.screen:before{content:"";position:absolute;inset:12px;pointer-events:none;border:1px solid #d895ba66;box-shadow:inset 0 0 25px #ec198522,0 0 32px #fa168b22;border-radius:8px}.screen:after{content:"";position:absolute;inset:0;z-index:-1;opacity:.16;background:repeating-linear-gradient(0deg,transparent 0 57px,#ec6caf18 58px 59px),radial-gradient(circle at 15% 15%,#ff57bb,transparent 26%),radial-gradient(circle at 90% 70%,#e63298,transparent 27%)}header{text-align:center;position:relative;padding-bottom:1.2%;margin-bottom:1.8%;border-bottom:1px solid #e99bc666}header .mark{width:clamp(42px,5vw,88px);height:clamp(42px,5vw,88px);object-fit:contain;filter:drop-shadow(0 0 13px #ff149e)}header h1{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:600;color:#ffc2e8;text-shadow:0 0 18px #ff149d;font-size:clamp(30px,4.2vw,77px);line-height:1.1;margin:0}header .sub{display:flex;align-items:center;justify-content:center;gap:20px;color:var(--gold);letter-spacing:.35em;font-weight:600;font-size:clamp(12px,1.4vw,26px);margin-top:8px}header .sub:before,header .sub:after{content:"";height:1px;width:9%;background:linear-gradient(90deg,transparent,var(--gold))}header .sub:after{transform:rotate(180deg)}.layout{display:grid;grid-template-columns:1fr 1.03fr .98fr;gap:1.6vw;align-items:stretch}.panel{position:relative;min-width:0;border:1px solid #f44aab99;border-radius:18px;padding:1.2vw;background:linear-gradient(140deg,#36142cde,#160c1de8 55%,#2b1024de);box-shadow:0 0 18px #f20e8822,inset 0 0 35px #ec26910b}.panel:before{content:"";position:absolute;inset:5px;border:1px solid #f5b6d32a;border-radius:14px;pointer-events:none}.panel h2{font-family:'Playfair Display',Georgia,serif;font-size:clamp(21px,2.05vw,40px);color:var(--gold);text-align:center;margin:.1em 0 .2em;text-shadow:0 0 14px #b76c3244}.panel .rule{width:48%;height:2px;margin:0 auto 1.1vw;background:linear-gradient(90deg,transparent,var(--pink),transparent)}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75vw}.card{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;gap:.3vw;padding:.6vw .3vw .7vw;border:1px solid #e26da35c;border-radius:12px;background:radial-gradient(ellipse at top,#5d25465c,#1b0b1c88 75%);min-height:clamp(132px,14vw,255px)}.photo{height:clamp(75px,9vw,160px);width:100%;display:grid;place-items:center}.photo img{width:94%;height:100%;object-fit:contain;filter:drop-shadow(0 7px 10px #000a) drop-shadow(0 0 12px #f2468b55)}.photo .missing{display:none;color:#a97799;font-size:12px}.card strong{font-size:clamp(12px,1.13vw,22px);font-weight:700;letter-spacing:.015em}.card small{font-size:clamp(10px,.86vw,16px);color:#edb7d4}.card .price{color:var(--gold);border:1px solid #e6b77b55;border-radius:30px;padding:.2em .7em;font-weight:700;font-size:clamp(11px,.9vw,17px)}.panel .tag{text-align:center;color:#d8a1c0;font-size:clamp(11px,.86vw,16px);margin-top:1vw;letter-spacing:.04em}.snack-card{min-height:clamp(125px,12vw,230px)}.snack-card .photo{height:clamp(65px,7vw,135px)}footer{display:flex;align-items:center;justify-content:space-between;margin-top:1.6%;padding:.7vw .5vw 0;border-top:1px solid #f3c6d655;color:#e7b4d1;font-size:clamp(10px,.8vw,15px);letter-spacing:.12em;text-transform:uppercase}footer b{color:var(--gold);font-weight:600}@media(min-aspect-ratio:16/9) and (min-width:1100px){.screen{min-height:100vh}}@media(max-width:950px){.layout{grid-template-columns:1fr}.panel{padding:18px}.cards{gap:12px;grid-template-columns:repeat(3,minmax(0,1fr))}.card{padding:12px 8px}.photo{height:115px}header{padding:20px}footer{gap:20px;flex-wrap:wrap}}@media(max-width:520px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.screen{padding:16px}.panel{margin:6px 0}.photo{height:90px}header .sub{letter-spacing:.14em}}
</style></head>
<body><main class="screen"><header><img class="mark" src="assets/vu-unicorn.svg" alt="Vanilla Unicorn"><h1>Vanilla Unicorn</h1><div class="sub">DRINKS &amp; SNACKS</div></header><div class="layout" id="layout"></div><footer><span>Los Santos · Vanilla Unicorn</span><span><b>Preview</b> · Confirm selling prices before publishing</span><span>Ask our team at the bar</span></footer></main>
<script>
const groups=[
{title:"Spirits & Bottles",tag:"Served at the bar",items:[["Whiskey","whiskey"],["Vodka","vodka"],["Rum","rum"],["Tequila","tequila"],["Absinthe","absinthe"],["Beer","beer"],["Cider","cider"]]},
{title:"Soft Drinks",tag:"Something refreshing",items:[["Sprunk","sprunk"],["Koka","koka"],["Frezzi","frezzi"],["Tanga","tanga"],["Sweet Tea","sweet_tea"],["Green Cow","green_cow"],["Water","water"]]},
{title:"Bar Snacks",tag:"A little something on the side",items:[["Hot Dog","hot_dog"],["Ham Sandwich","ham_sandwich"],["Nachos","nachos"],["Salted Peanuts","salted_peanuts"],["S'mores","smores"]]}];
const root=document.getElementById("layout");for(const group of groups){const section=document.createElement("section");section.className="panel";const heading=document.createElement("h2");heading.textContent=group.title;section.append(heading);const rule=document.createElement("div");rule.className="rule";section.append(rule);const grid=document.createElement("div");grid.className="cards";for(const [name,id] of group.items){const card=document.createElement("article");card.className="card"+(group.title==="Bar Snacks"?" snack-card":"");const photo=document.createElement("div");photo.className="photo";const img=document.createElement("img");img.alt=name;img.loading="eager";img.src="https://p17.admin.opfw.me/images/icons/items/"+encodeURIComponent(id)+".png";const missing=document.createElement("span");missing.className="missing";missing.textContent="Image unavailable";img.onerror=()=>{img.remove();missing.style.display="block"};photo.append(img,missing);const label=document.createElement("strong");label.textContent=name;const price=document.createElement("span");price.className="price";price.textContent="Price TBC";card.append(photo,label,price);grid.append(card)}section.append(grid);const tag=document.createElement("div");tag.className="tag";tag.textContent=group.tag;section.append(tag);root.append(section)}
</script></body></html>

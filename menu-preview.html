<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vanilla Unicorn — Actual Stock Menu Preview</title><style>*{box-sizing:border-box}body{margin:0;background:#110713;color:#fff4fb;font-family:Arial,sans-serif}.frame{min-height:100vh;padding:3.5vw;background:radial-gradient(ellipse at top,#581339,#100710 65%);border:8px solid #fc2aa6}.head{text-align:center;margin:0 0 3vw}.head img{width:75px;filter:drop-shadow(0 0 12px #ff39bb)}h1{font-family:Georgia,serif;font-style:italic;font-size:clamp(36px,5vw,76px);color:#ff9bda;margin:0;text-shadow:0 0 15px #f05}h2{color:#f2c887;letter-spacing:.15em;font-weight:400;font-size:clamp(16px,2vw,32px)}.sections{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}.section{border:2px solid #ef399f;border-radius:18px;background:#190b1dba;padding:16px;box-shadow:0 0 18px #d6007d66}.section h3{font-family:Georgia,serif;color:#ffcf82;font-size:clamp(18px,2vw,30px);margin:0 0 12px}.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{background:#290f2a;border:1px solid #7e2a64;border-radius:12px;min-height:120px;text-align:center;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center}.item img{height:66px;width:78px;object-fit:contain;image-rendering:auto}.item strong{font-size:clamp(12px,1.25vw,19px);margin-top:5px}.item small{color:#dba9c9;margin-top:5px}footer{text-align:center;color:#d9a3c7;margin-top:20px;font-size:13px}@media(max-width:900px){.sections{grid-template-columns:1fr}.items{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:450px){.items{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><main class="frame"><header class="head"><img src="assets/vu-unicorn.svg" alt="Vanilla Unicorn emblem"><h1>Vanilla Unicorn</h1><h2>BAR DRINKS & SNACKS</h2></header><div class="sections" id="sections"></div><footer>PREVIEW • Actual stocked item names and catalogue image links • Selling prices to be confirmed</footer></main><script>const items=[["Beer","beer"],["Cider","cider"],["Whiskey","whiskey"],["Rum","rum"],["Vodka","vodka"],["Tequila","tequila"],["Absinthe","absinthe"],["Sprunk","sprunk"],["Koka","koka"],["Frezzi","frezzi"],["Tanga","tanga"],["Sweet Tea","sweet_tea"],["Green Cow","green_cow"],["Water","water"],["Hot Dog","hot_dog"],["Ham Sandwich","ham_sandwich"],["Nachos","nachos"],["Salted Peanuts","salted_peanuts"],["S'mores","smores"]];const groups=[["Alcohol & Spirits",0,7],["Soft Drinks",7,14],["Snacks",14,19]];for(const [title,start,end] of groups){const section=document.createElement("section");section.className="section";const h=document.createElement("h3");h.textContent=title;section.append(h);const grid=document.createElement("div");grid.className="items";for(const [name,id] of items.slice(start,end)){const card=document.createElement("div");card.className="item";const img=document.createElement("img");img.src="https://p17.admin.opfw.me/images/icons/items/"+encodeURIComponent(id)+".png";img.alt=name;img.onerror=()=>{img.style.display="none";};const label=document.createElement("strong");label.textContent=name;const price=document.createElement("small");price.textContent="Price to confirm";card.append(img,label,price);grid.append(card)}section.append(grid);document.getElementById("sections").append(section)}</script></body></html>
